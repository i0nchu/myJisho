version: 2
updates:
  - package-ecosystem: pub
    directory: /apps/dictionary_app
    schedule:
      interval: weekly
      day: monday
      time: "03:00"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "03:30"
      timezone: Asia/Taipei
    open-pull-requests-limit: 5
