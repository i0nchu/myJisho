name: Kotoba CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Data and search tests
        run: python -m unittest discover -s tests -v
      - name: Content editor tests
        run: python -m unittest discover -s services/editor_api/tests -v
      - name: Self-hosted generation tests
        run: python -m unittest discover -s services/local_dictionary/tests -t . -v
      - name: Ubuntu staging deployment preflight
        run: |
          shellcheck \
            scripts/install-docker-ubuntu.sh \
            scripts/deploy-self-hosted.sh \
            scripts/backup-self-hosted.sh \
            scripts/restore-self-hosted.sh
          bash scripts/deploy-self-hosted.sh --help | grep -- "--ollama-url"
          if grep -Eq '(^|[[:space:]])ollama[[:space:]]+(pull|show|list)' \
            scripts/deploy-self-hosted.sh; then
            echo "Ubuntu deploy script must use the Ollama HTTP API, not a host CLI."
            exit 1
          fi
          python -m py_compile scripts/stage-smoke-test.py
          docker compose \
            --env-file deploy/.env.example \
            -f deploy/compose.internal.yaml \
            config --quiet
          docker compose \
            --env-file deploy/.env.example \
            -f deploy/compose.internal.yaml \
            config --format json |
            python -c 'import json,sys; d=json.load(sys.stdin); s=d["services"]["kotoba-api"]; assert s["network_mode"] == "host"; assert "ports" not in s; assert "ollama" not in d["services"]; assert s["environment"]["KOTOBA_API_HOST"] == "127.0.0.1"; assert s["environment"]["KOTOBA_LLM_BASE_URL"] == "http://127.0.0.1:11434/v1"'
          docker compose \
            --env-file deploy/.env.example \
            -f deploy/compose.internal.yaml \
            build kotoba-api
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - name: Flutter quality gates
        working-directory: apps/dictionary_app
        run: |
          flutter pub get
          dart format --output=none --set-exit-if-changed lib test
          flutter analyze
          flutter test
          flutter build web --release
      - name: Dependency, license, secret, and SBOM audit
        run: python tools/security_audit.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kotoba-web
          path: apps/dictionary_app/build/web
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kotoba-security-evidence
          path: |
            build/security-audit.json
            build/kotoba.cdx.json
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - name: Build Windows release app
        working-directory: apps/dictionary_app
        run: flutter build windows --release
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kotoba-windows-release-unsigned
          path: apps/dictionary_app/build/windows/x64/runner/Release
          if-no-files-found: error

  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true
      - name: Build macOS release app
        working-directory: apps/dictionary_app
        run: flutter build macos --release
      # Flutter does not support release/profile execution on the iOS
      # simulator. This is a compile preflight only; signed physical-device
      # release archives remain an external release gate.
      - name: Build iOS debug simulator app
        working-directory: apps/dictionary_app
        run: flutter build ios --debug --simulator --no-codesign
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: kotoba-apple-preflight-unsigned
          path: |
            apps/dictionary_app/build/macos/Build/Products/Release
            apps/dictionary_app/build/ios/iphonesimulator/Runner.app
          if-no-files-found: error
