services:
  ollama:
    image: ollama/ollama:0.32.3
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12

  myjisho-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.local-dictionary
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      MYJISHO_API_TOKEN: ${MYJISHO_API_TOKEN:?MYJISHO_API_TOKEN is required}
      MYJISHO_ALLOWED_HOSTS: ${MYJISHO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      MYJISHO_LLM_BASE_URL: http://ollama:11434/v1
      MYJISHO_LLM_MODEL: ${MYJISHO_LLM_MODEL:?MYJISHO_LLM_MODEL is required}
    ports:
      - "127.0.0.1:8766:8766"
    volumes:
      - myjisho-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; r=urllib.request.Request('http://127.0.0.1:8766/api/health',headers={'Authorization':'Bearer '+os.environ['MYJISHO_API_TOKEN']}); urllib.request.urlopen(r,timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  myjisho-data:
  ollama-models:
