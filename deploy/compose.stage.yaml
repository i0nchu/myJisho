services:
  kotoba-api:
    environment:
      KOTOBA_ALLOWED_HOSTS: ${KOTOBA_ALLOWED_HOSTS:?KOTOBA_ALLOWED_HOSTS is required}

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      kotoba-api:
        condition: service_healthy
    environment:
      KOTOBA_STAGE_DOMAIN: ${KOTOBA_STAGE_DOMAIN:?KOTOBA_STAGE_DOMAIN is required}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  backup-helper:
    image: alpine:3.22.2
    profiles: ["tools"]
    network_mode: none
    volumes:
      - kotoba-data:/data
      - ${KOTOBA_BACKUP_DIR:-./backups}:/backup

volumes:
  caddy-data:
  caddy-config:
