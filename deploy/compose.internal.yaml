services:
  myjisho-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.local-dictionary
    restart: unless-stopped
    network_mode: host
    environment:
      MYJISHO_API_HOST: ${MYJISHO_API_HOST:-127.0.0.1}
      MYJISHO_API_TOKEN: ${MYJISHO_API_TOKEN:?MYJISHO_API_TOKEN is required}
      MYJISHO_ALLOWED_HOSTS: ${MYJISHO_ALLOWED_HOSTS:-127.0.0.1,localhost}
      MYJISHO_LLM_BASE_URL: ${MYJISHO_LLM_BASE_URL:-http://127.0.0.1:11434/v1}
      MYJISHO_LLM_MODEL: ${MYJISHO_LLM_MODEL:?MYJISHO_LLM_MODEL is required}
    volumes:
      - myjisho-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import os,urllib.request; host=os.environ['MYJISHO_API_HOST']; r=urllib.request.Request('http://'+host+':8766/api/health',headers={'Authorization':'Bearer '+os.environ['MYJISHO_API_TOKEN']}); urllib.request.urlopen(r,timeout=3).read()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "5"

  backup-helper:
    image: alpine:3.22.2
    profiles: ["tools"]
    network_mode: none
    volumes:
      - myjisho-data:/data
      - ${MYJISHO_BACKUP_DIR:-./backups}:/backup

volumes:
  myjisho-data:
