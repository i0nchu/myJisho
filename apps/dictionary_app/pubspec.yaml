name: myjisho_dictionary_app
description: Offline-first Japanese dictionary client for the myJisho project.
publish_to: none
version: 0.1.1+2

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  audioplayers: ^6.8.1
  crypto: ^3.0.7
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_tts: ^4.2.5
  go_router: ^17.3.0
  http: ^1.5.0
  path: ^1.9.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  sqlite3: ^3.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fixtures/dictionary.json
    - assets/database/dictionary.sqlite
